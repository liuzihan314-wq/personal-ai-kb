<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Personal AI Knowledge Base V1 数据流</title>
  <desc id="desc">从微信公众号文章、文本 PDF 和观点卡片进入 Raw，经过 Notes、Knowledge、Index 和 Retrieval，生成选题；用户人工选择后再次检索证据，最后生成口播。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f3"/>
      <stop offset="1" stop-color="#f0f4f8"/>
    </linearGradient>
    <linearGradient id="raw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0e4"/>
      <stop offset="1" stop-color="#ffe2cc"/>
    </linearGradient>
    <linearGradient id="notes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0ebff"/>
      <stop offset="1" stop-color="#e1d8ff"/>
    </linearGradient>
    <linearGradient id="knowledge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f3ff"/>
      <stop offset="1" stop-color="#cfe9fb"/>
    </linearGradient>
    <linearGradient id="retrieval" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5f7ee"/>
      <stop offset="1" stop-color="#cceedd"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="1" stop-color="#ffeb9e"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7f1"/>
      <stop offset="1" stop-color="#f8cfe0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#26384a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#526577"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a17"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243342; }
      .title { font-size: 34px; font-weight: 760; letter-spacing: 0.01em; }
      .subtitle { font-size: 17px; fill: #607181; }
      .eyebrow { font-size: 14px; font-weight: 760; letter-spacing: 0.12em; fill: #647687; }
      .node-title { font-size: 22px; font-weight: 760; }
      .node-subtitle { font-size: 14px; fill: #536575; }
      .small { font-size: 13px; fill: #647687; }
      .label { font-size: 15px; font-weight: 680; }
      .arrow { stroke: #526577; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-accent { stroke: #a8792b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowAccent); }
      .node { stroke: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .mini { fill: #ffffff; stroke: #d8e0e7; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1510" cy="75" r="130" fill="#dcecf5" opacity="0.45"/>
  <circle cx="120" cy="820" r="180" fill="#f8e4d9" opacity="0.35"/>

  <text x="56" y="70" class="font title">Personal AI Knowledge Base</text>
  <text x="56" y="105" class="font subtitle">V1：把资料、判断与内容创作放在同一条可追溯链路里</text>
  <rect x="1287" y="48" width="257" height="42" rx="21" fill="#22384a"/>
  <text x="1415" y="75" text-anchor="middle" class="font" style="font-size:15px;font-weight:760;fill:#ffffff;">LOCAL · SINGLE USER · V1</text>

  <text x="56" y="163" class="font eyebrow">INPUT ADAPTERS</text>
  <rect x="56" y="182" width="340" height="108" rx="20" class="mini"/>
  <text x="78" y="215" class="font label">公众号文章 URL</text>
  <text x="78" y="246" class="font label">正常文本 PDF</text>
  <text x="78" y="277" class="font label">观点／好句卡片</text>
  <path d="M226 290 C226 320 135 320 135 350" class="arrow"/>
  <text x="250" y="327" class="font small">统一输入</text>

  <text x="56" y="337" class="font eyebrow">TRACEABLE CORE FLOW</text>

  <!-- Main flow nodes -->
  <rect x="56" y="362" width="160" height="148" rx="22" fill="url(#raw)" class="node"/>
  <text x="136" y="409" text-anchor="middle" class="font node-title">Raw</text>
  <text x="136" y="440" text-anchor="middle" class="font node-subtitle">原始资料</text>
  <text x="136" y="470" text-anchor="middle" class="font small">事实来源</text>
  <text x="136" y="491" text-anchor="middle" class="font small">不可被 AI 覆盖</text>

  <rect x="248" y="362" width="160" height="148" rx="22" fill="url(#notes)" class="node"/>
  <text x="328" y="409" text-anchor="middle" class="font node-title">Notes</text>
  <text x="328" y="440" text-anchor="middle" class="font node-subtitle">单篇理解</text>
  <text x="328" y="470" text-anchor="middle" class="font small">摘要 · 观点</text>
  <text x="328" y="491" text-anchor="middle" class="font small">好句 · 标签</text>

  <rect x="440" y="362" width="160" height="148" rx="22" fill="url(#knowledge)" class="node"/>
  <text x="520" y="409" text-anchor="middle" class="font node-title">Knowledge</text>
  <text x="520" y="440" text-anchor="middle" class="font node-subtitle">主题编译</text>
  <text x="520" y="470" text-anchor="middle" class="font small">共识 · 分歧</text>
  <text x="520" y="491" text-anchor="middle" class="font small">当前综合判断</text>

  <rect x="632" y="362" width="160" height="148" rx="22" fill="url(#retrieval)" class="node"/>
  <text x="712" y="399" text-anchor="middle" class="font node-title">Index /</text>
  <text x="712" y="427" text-anchor="middle" class="font node-title">Retrieval</text>
  <text x="712" y="465" text-anchor="middle" class="font small">标题 · 标签 · 关键词</text>
  <text x="712" y="487" text-anchor="middle" class="font small">Topic · Related</text>

  <rect x="824" y="362" width="160" height="148" rx="22" fill="#edf5ff" class="node"/>
  <text x="904" y="409" text-anchor="middle" class="font node-title">选题</text>
  <text x="904" y="440" text-anchor="middle" class="font node-subtitle">Topic radar</text>
  <text x="904" y="470" text-anchor="middle" class="font small">3～5 个候选</text>
  <text x="904" y="491" text-anchor="middle" class="font small">有依据的方向</text>

  <rect x="1016" y="362" width="160" height="148" rx="22" fill="url(#decision)" class="node"/>
  <text x="1096" y="409" text-anchor="middle" class="font node-title">人工选择</text>
  <text x="1096" y="440" text-anchor="middle" class="font node-subtitle">Decision gate</text>
  <text x="1096" y="470" text-anchor="middle" class="font small">查看证据</text>
  <text x="1096" y="491" text-anchor="middle" class="font small">确认后才继续</text>

  <rect x="1208" y="362" width="160" height="148" rx="22" fill="#eef7f0" class="node"/>
  <text x="1288" y="409" text-anchor="middle" class="font node-title">再检索</text>
  <text x="1288" y="440" text-anchor="middle" class="font node-subtitle">Fresh evidence</text>
  <text x="1288" y="470" text-anchor="middle" class="font small">围绕已选选题</text>
  <text x="1288" y="491" text-anchor="middle" class="font small">重新组织上下文</text>

  <rect x="1400" y="362" width="144" height="148" rx="22" fill="url(#output)" class="node"/>
  <text x="1472" y="409" text-anchor="middle" class="font node-title">口播</text>
  <text x="1472" y="440" text-anchor="middle" class="font node-subtitle">Traceable script</text>
  <text x="1472" y="470" text-anchor="middle" class="font small">2～3 分钟</text>
  <text x="1472" y="491" text-anchor="middle" class="font small">自然、有依据</text>

  <path d="M216 436 H240" class="arrow"/>
  <path d="M408 436 H432" class="arrow"/>
  <path d="M600 436 H624" class="arrow"/>
  <path d="M792 436 H816" class="arrow"/>
  <path d="M984 436 H1008" class="arrow"/>
  <path d="M1176 436 H1200" class="arrow"/>
  <path d="M1368 436 H1392" class="arrow"/>

  <!-- Supporting outputs -->
  <path d="M712 510 C712 563 610 563 610 600" class="arrow-accent"/>
  <path d="M712 510 C712 563 814 563 814 600" class="arrow-accent"/>
  <rect x="500" y="600" width="220" height="82" rx="18" fill="#ffffff" stroke="#d8e0e7" stroke-width="1.5"/>
  <text x="610" y="635" text-anchor="middle" class="font node-title" style="font-size:20px;">知识问答</text>
  <text x="610" y="660" text-anchor="middle" class="font small">候选、证据与来源链</text>
  <rect x="704" y="600" width="220" height="82" rx="18" fill="#ffffff" stroke="#d8e0e7" stroke-width="1.5"/>
  <text x="814" y="635" text-anchor="middle" class="font node-title" style="font-size:20px;">主题综合</text>
  <text x="814" y="660" text-anchor="middle" class="font small">多篇 Notes → 当前认知</text>
  <text x="956" y="634" class="font small">中间输出，不改变主链路</text>

  <!-- Trust boundary / legend -->
  <rect x="56" y="756" width="1488" height="82" rx="22" fill="#22384a"/>
  <circle cx="91" cy="788" r="7" fill="#b9e1c7"/>
  <text x="110" y="794" class="font" style="font-size:15px;font-weight:700;fill:#ffffff;">实线：V1 主闭环</text>
  <line x1="310" y1="788" x2="354" y2="788" stroke="#ffcc66" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="374" y="794" class="font" style="font-size:15px;font-weight:700;fill:#ffffff;">虚线：由 Index / Retrieval 派生的证据流</text>
  <text x="56" y="818" class="font" style="font-size:14px;fill:#c7d4df;">V1 保持本地文件优先；AI Provider 只在用户配置后参与语义加工，Raw、Notes、Knowledge、Index 分层保存。</text>
</svg>
